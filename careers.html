<!DOCTYPE html>

    <title>Careers - NCT</title>

<header>
    <img src="images/logo.jpg">
    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="careers.html">Careers</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section>
    <h2>We're Hiring Drivers</h2>
    <p>Fill out the form below to apply.</p>

    <form action="https://formsubmit.co/youremail@example.com" method="POST">

        <input type="text" name="name" placeholder="Full Name" required>
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="tel" name="phone" placeholder="Phone Number" required>

        <input type="text" name="experience" placeholder="Years of Experience">

        <select name="license">
            <option value="">License Type</option>
            <option>CDL A</option>
            <option>CDL B</option>
        </select>

        <textarea name="message" placeholder="Tell us about your experience"></textarea>

        <input type="hidden" name="_captcha" value="false">

        <button type="submit">Submit Application</button>
    </form>
</section>

<footer>
    <p>© 2026 NCT Transportation</p>
</footer>

</body>
</html>
